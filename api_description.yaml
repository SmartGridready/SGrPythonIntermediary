paths:
  /instances:
    post:
      summary: "Initialize a new instance of the Generic Interface"
      description: |
        ## Initialize a new instance of the Generic Interface
        
        ### Request Body
        
        The request body should be a form-data object containing two files: an INI file and an XML file.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                xml:
                  type: string
                  format: binary
                  description: "XML file"
                ini:
                  type: string
                  format: binary
                  description: "INI file"
      responses:
        '200':
          description: |
            ### Response
            
            The response will be a JSON object containing the status of the initialization and the instance id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  instance_id:
                    type: string
                    example: "1"

  /instances:
    get:
      summary: "Retrieve initialized instances"
      description: |
        ## Retrieve initialized instances
        
        ### Response
        
        The response will be a JSON object where each key represents an instance id and its associated value is another JSON object detailing the instance's XML and INI paths.
      responses:
        '200':
          description: "A JSON object of all initialized instances."
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    instance_id:
                      type: string
                    xml:
                      type: string
                    ini:
                      type: string
              example:
                "1": { "instance_id": "1", "xml": "1.xml", "ini": "1.ini" }
                "2": { "instance_id": "2", "xml": "2.xml", "ini": "2.ini" }

  /instances/{instance_id}:
    delete:
      summary: "Delete an instance of the Generic Interface"
      description: |
        ## Delete an instance of the Generic Interface
        
        ### Request
        
        The request should contain the instance id of the instance to delete.
      parameters:
        - in: path
          name: instance_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Success message upon deletion."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"

  /get:
    post:
      summary: "Retrieve datapoint of specific functional profile"
      description: |
        ## Retrieve datapoint of specific functional profile 
        
        ### Request Body
        
        The request body should be a JSON object where each key represents an identifier and its associated value is another JSON object detailing metrics of interest.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: "Return the requested data."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object

  /set:
    post:
      summary: "Set values in the Generic Interface"
      description: |
        ## Set values in the Generic Interface
        
        ### Request Body
        
        The request body should be a JSON object where each key represents an identifier and its associated value is another JSON object detailing metrics of interest.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: "Response with success status."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
